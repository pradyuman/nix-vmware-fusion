[package]
name = "nix-vmware-fusion"
version = "0.1.0"
edition = "2024"

[features]
vmware-contract-tests = []

[dependencies]
anyhow = "1.0.104"
atomic-write-file = "0.3.1"
clap = { version = "4.6.6", features = ["derive"] }
config = { version = "0.15.25", default-features = false }
duct = "1.1.2"
nutype = { version = "0.7.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
